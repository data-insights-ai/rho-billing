name: integration
# The database-backed half of the suite: concurrency, locking, migrations,
# recovery and the examples. It is deliberately not on every push — it needs a
# Postgres service and takes minutes rather than seconds. Run it on demand, and
# nightly so a regression cannot sit unnoticed for long.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing-ci-only
          POSTGRES_DB: billing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U billing -d billing"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      BILLING_TEST_DATABASE_URL: postgres://billing:billing-ci-only@localhost:5432/billing?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sh scripts/check-local.sh
